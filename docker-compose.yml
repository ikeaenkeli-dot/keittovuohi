services:

  blakkis:
    container_name: blakkis-bot
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://blakkis:blakkis@db:5432/blakkis
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    container_name: blakkis-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blakkis
      POSTGRES_PASSWORD: blakkis
      POSTGRES_DB: blakkis
    volumes:
      - blakkis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blakkis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  blakkis-data:
